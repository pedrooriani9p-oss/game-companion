# Gera o .exe no Windows e publica uma versão no GitHub quando a versão do package.json muda na main.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ler a versão
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win portable --x64 --publish never
      - name: Publicar a versão com o .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Game Companion ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: |
            Baixe o .exe abaixo e abra com dois cliques. Na primeira vez, o Windows pode mostrar um aviso: clique em "Mais informações" e depois em "Executar assim mesmo".
